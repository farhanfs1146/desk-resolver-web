<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="confirm-message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <!-- Cancel is the default focus target, so pressing Enter on a confirmation does nothing. -->
  <button matButton type="button" [mat-dialog-close]="false" cdkFocusInitial>Cancel</button>
  <button
    matButton="filled"
    type="button"
    [mat-dialog-close]="true"
    [class.confirm-danger]="data.destructive"
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
